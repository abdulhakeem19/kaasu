name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Signing material never lives in the repository. Without these secrets the build still
      # succeeds, but produces an unsigned APK — so the step below fails loudly instead, rather
      # than publishing something nobody can install.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See docs/RELEASING.md for the four secrets this needs."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > kaasu-android/kaasu-release.jks
          cat > kaasu-android/keystore.properties <<EOF
          storeFile=kaasu-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run tests
        working-directory: kaasu-android
        run: ./gradlew test --no-daemon

      - name: Build release APK
        working-directory: kaasu-android
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f kaasu-android/kaasu-release.jks kaasu-android/keystore.properties

      - name: Stage artifact and checksum
        id: stage
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist
          APK=$(find kaasu-android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          cp "$APK" "dist/kaasu-${VERSION}.apk"
          cd dist
          sha256sum "kaasu-${VERSION}.apk" > "kaasu-${VERSION}.apk.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "kaasu-${VERSION}.apk.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.stage.outputs.tag }}
          VERSION: ${{ steps.stage.outputs.version }}
          SHA: ${{ steps.stage.outputs.sha }}
        run: |
          cat > notes.md <<EOF
          ## Install

          1. Download \`kaasu-${VERSION}.apk\` below.
          2. Open it on your Android phone and allow installs from your browser or file manager when asked.
          3. Open Kaasu, finish onboarding, and grant **notification access** when prompted — this opens Android Settings rather than a normal popup.
          4. Optional: grant SMS access, then **Settings → Re-scan SMS inbox** to import past messages.

          Requires Android 8.0 or later. Kaasu is not on Google Play — see the README for why.

          ## Verify the download

          This app can read your payment notifications and SMS, so it is worth checking you got the file this workflow built:

          \`\`\`
          sha256sum kaasu-${VERSION}.apk
          # expected: ${SHA}
          \`\`\`

          Built by GitHub Actions from the \`${TAG}\` tag — the run log shows exactly which commit produced it.

          ## What's in this version

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          EOF
          gh release create "$TAG" \
            dist/kaasu-${VERSION}.apk \
            dist/kaasu-${VERSION}.apk.sha256 \
            --title "Kaasu $TAG" \
            --notes-file notes.md \
            --verify-tag
