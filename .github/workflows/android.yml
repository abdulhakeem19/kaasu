name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: kaasu-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Android lint
        run: ./gradlew lint --no-daemon

      # Release signing is local-only, so CI builds the debug variant. The signing config must
      # tolerate a missing keystore.properties for this step to work on a fresh checkout.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            kaasu-android/app/build/reports/tests/
            kaasu-android/app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
